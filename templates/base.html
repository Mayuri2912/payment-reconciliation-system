<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment Reconciliation</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <span class="brand">Payment Reconciliation</span>
  <a href="{{ url_for('overview') }}" class="{{ 'on' if active=='overview' }}">Overview</a>
  <a href="{{ url_for('discrepancies') }}" class="{{ 'on' if active=='discrepancies' }}">Discrepancies</a>
  <a href="{{ url_for('transactions') }}" class="{{ 'on' if active=='transactions' }}">Transactions</a>
  <a href="{{ url_for('report') }}" class="{{ 'on' if active=='report' }}">Report</a>
  <a href="{{ url_for('data') }}" class="{{ 'on' if active=='data' }}">Data</a>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
